# Gradle Configuration Properties
# Performance optimizations and build settings

# JVM Memory Settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Gradle Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android Configuration
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdkWarning=false

# Kotlin Configuration
kotlin.code.style=official
kotlin.incremental.multiplatform=true

# Build Configuration
android.enableOnDemandModules=false

# Project Configuration
org.gradle.daemon=true
org.gradle.configureondemand=true

# Version Information
kotlinVersion=2.0.0
androidGradleVersion=8.3.0
composeBomVersion=2024.12.00
